services:
  highlight-generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: highlight-generator:latest
    container_name: highlight-studio
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-}
      - API_TOKEN=${API_TOKEN:-}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-1}
      - MAX_UPLOAD_GB=${MAX_UPLOAD_GB:-}
      - RETENTION_DAYS=${RETENTION_DAYS:-}
      - ENABLE_URL_IMPORT=${ENABLE_URL_IMPORT:-}
      - YTDLP_COOKIES_FILE=${YTDLP_COOKIES_FILE:-}
      - YTDLP_PROXY_URL=${YTDLP_PROXY_URL:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
