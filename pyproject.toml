[project]
name = "highlight-generator"
version = "0.2.0"
description = "Automated football (soccer) match highlight reel generator powered by adaptive audio crowd excitement detection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
    "scipy==1.18.0",
    "matplotlib==3.11.1",
    "imageio-ffmpeg==0.6.0",
    "tqdm==4.70.0",
    "python-dotenv==1.2.3",
    "pillow==11.3.0",
    "yt-dlp[default]==2026.8.19",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "scipy-stubs>=1.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["codebase", "."]
testpaths = ["tests"]
addopts = "-v"

[tool.pyright]
extraPaths = ["codebase"]
venvPath = "."
venv = ".venv"

